name: ci

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read
jobs:
  unit_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 0
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26
          cache: true
      # Images may expose MinGW's make.exe. Chocolatey GNU Make is what the Makefile expects.
      - name: Install GNU Make
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --no-progress -y
      - name: Add tools to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\usr\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\ProgramData\chocolatey\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "$(go env GOPATH)\bin"
      - name: Add GOPATH/bin to PATH
        if: runner.os != 'Windows'
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make --version
      - run: make deps
      # swagger_gen round-trip + git diff is Ubuntu-only (line endings on Windows).
      - name: Check generated swagger is committed
        if: runner.os != 'Windows'
        run: make ci-swagger
      - run: make ci
      - uses: codecov/codecov-action@v4
        if: runner.os == 'Linux'
  ui_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: browser/flagr-ui/package-lock.json
      - run: make build-ui
  # Same build as pages.yml (make build-docs). Catches dead VitePress links and
  # docs package/lock issues on PRs before Deploy docs to GitHub Pages runs on main.
  docs_build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json
      - run: make build-docs
  integration_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Integration tests and benchmarks (Docker Compose)
        run: make ci-integration DOCKER_BUILDX_CACHE="--cache-from type=gha --cache-to type=gha,mode=max"
  e2e_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: browser/flagr-ui/package-lock.json
      - run: make test-e2e
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash
  dep_freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: browser/flagr-ui/package-lock.json
      - name: Check Go dependency freshness (5-day minimum age)
        run: MIN_AGE_DAYS=5 ./scripts/check-dep-freshness.sh

