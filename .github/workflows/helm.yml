name: helm

on:
  pull_request:
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"
  push:
    branches: [main]
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.1.2 --verify=false
      - run: make helm-lint
      - run: make helm-unittest

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - uses: helm/kind-action@v1.12.0
      - name: SQLite (default, one writer)
        run: |
          set -euo pipefail
          helm install flagr ./helm --wait --timeout 3m
          helm test flagr --timeout 2m
          helm uninstall flagr --wait
      - name: SQLite HA (evalReplicas)
        run: |
          set -euo pipefail
          helm install flagr ./helm --set evalReplicas.replicaCount=1 --wait --timeout 3m
          helm test flagr --timeout 2m
          kubectl wait --for=condition=available --timeout=120s deploy/flagr-eval
          kubectl run flagr-eval-health --attach --rm --restart=Never --image=curlimages/curl:8.1.2 -- \
            curl -fsS http://flagr-eval:18000/api/v1/health
          helm uninstall flagr --wait
      - name: GitOps (json_http, identical pods)
        run: |
          set -euo pipefail
          kubectl apply -f helm/ci/flags-http.yaml
          kubectl wait --for=condition=available --timeout=120s deploy/flagr-ci-flags
          helm install flagr ./helm \
            --set gitops.enabled=true \
            --set gitops.flagsURL=http://flagr-ci-flags/flags.json \
            --set replicaCount=2 \
            --wait --timeout 3m
          helm test flagr --timeout 2m
          kubectl get deploy flagr -o jsonpath='{.spec.replicas}{"\n"}' | grep -x 2
          helm uninstall flagr --wait
