{{- if gt (int .Values.evalReplicas.replicaCount) 0 }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flagr.evalFullname" . }}
  labels:
    {{- include "flagr.labels" . | nindent 4 }}
    app.kubernetes.io/component: eval
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "flagr.evalSelectorLabels" . | nindent 4 }}
{{- end }}
