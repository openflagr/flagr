{{- if gt (int .Values.evalReplicas.replicaCount) 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flagr.evalFullname" . }}
  labels:
    {{- include "flagr.labels" . | nindent 4 }}
    app.kubernetes.io/component: eval
spec:
  replicas: {{ .Values.evalReplicas.replicaCount }}
  selector:
    matchLabels:
      {{- include "flagr.evalSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "flagr.evalSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-primary
          image: "{{ .Values.test.image.repository }}:{{ .Values.test.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - curl
            - -fsS
            - --retry
            - "30"
            - --retry-all-errors
            - --retry-delay
            - "2"
            - {{ include "flagr.evalFlagsURL" . | quote }}
      containers:
        - name: flagr
          image: {{ include "flagr.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: FLAGR_LOGRUS_FORMAT
              value: json
            - name: FLAGR_DB_DBCONNECTION_DEBUG
              value: "false"
            - name: FLAGR_PPROF_ENABLED
              value: "false"
            - name: FLAGR_DB_DBDRIVER
              value: json_http
            - name: FLAGR_DB_DBCONNECTIONSTR
              value: {{ include "flagr.evalFlagsURL" . | quote }}
            {{- with .Values.evalReplicas.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- $res := .Values.evalReplicas.resources }}
          {{- if not $res }}{{ $res = .Values.resources }}{{ end }}
          {{- with $res }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
