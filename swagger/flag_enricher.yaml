put:
  tags:
    - enricher
  operationId: putEnricher
  parameters:
    - in: path
      name: flagID
      description: numeric ID of the flag
      required: true
      type: integer
      format: int64
      minimum: 1
    - in: path
      name: namespace
      description: namespace of the enricher to update
      required: true
      type: string
      minLength: 1
    - in: body
      name: body
      description: update the enricher config
      required: true
      schema:
        $ref: "#/definitions/putEnricherRequest"
  responses:
    200:
      description: enricher just updated
      schema:
        $ref: "#/definitions/enricher"
    default:
      description: generic error response
      schema:
        $ref: "#/definitions/error"
delete:
  tags:
    - enricher
  operationId: deleteEnricher
  parameters:
    - in: path
      name: flagID
      description: numeric ID of the flag
      required: true
      type: integer
      format: int64
      minimum: 1
    - in: path
      name: namespace
      description: namespace of the enricher to delete
      required: true
      type: string
      minLength: 1
  responses:
    200:
      description: deleted
    default:
      description: generic error response
      schema:
        $ref: "#/definitions/error"
